<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — OAB FÁCIL</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#17233b;background:#f6f8fb}body{max-width:520px;margin:48px auto;padding:0 20px}main{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:28px;box-shadow:0 10px 30px #17233b12}h1{margin-top:0}.eyebrow{color:#a67c2e;font-weight:700}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ccd4e0;border-radius:8px}button{margin-top:20px;padding:12px 16px;border:0;border-radius:8px;background:#c49a48;color:#17233b;font-weight:700;cursor:pointer;width:100%}button:disabled{opacity:.6}#message{min-height:24px;margin-top:16px}.muted{color:#667085}.back{display:inline-block;margin-top:20px;color:#9a7328}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">OAB FÁCIL</p>
    <h1>Entrar na área do aluno</h1>
    <p class="muted">Acesse seu plano de estudos e acompanhe seu progresso.</p>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="message" role="status"></p>
    <a class="back" href="/">← Voltar ao site</a>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button');
      const message = document.querySelector('#message');
      button.disabled = true; message.textContent = 'Verificando acesso…';
      try {
        const response = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email.value.trim(), password:password.value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Não foi possível entrar.');
        window.location.href = '/aluno';
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
  </script>
</body>
</html>
