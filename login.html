<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — OAB FÁCIL</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#17233b;background:#f6f8fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{max-width:520px;margin:48px auto;padding:0 20px}main{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:28px;box-shadow:0 10px 30px #17233b12}h1{margin-top:0;line-height:1.15}.eyebrow{color:#a67c2e;font-weight:700}label{display:block;margin-top:16px;font-weight:600}input{width:100%;margin-top:6px;padding:12px;min-height:44px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}button{margin-top:20px;padding:12px 16px;min-height:44px;border:0;border-radius:8px;background:#c49a48;color:#17233b;font-weight:700;cursor:pointer;width:100%}button:disabled{opacity:.6;cursor:not-allowed}.field-with-action{position:relative}.field-with-action input{padding-right:92px}.password-toggle{position:absolute;right:6px;bottom:4px;width:auto;margin:0;min-height:36px;padding:6px 9px;background:transparent;color:#9a7328;font-size:.8rem}.password-toggle:hover{background:#fff8e8}details{margin-top:22px;border-top:1px solid #e5e9f0;padding-top:15px}summary{cursor:pointer;font-weight:700;color:#17233b;padding:6px 0}#message{min-height:24px;margin-top:16px;color:#8b3d35}.muted{color:#667085;line-height:1.5}.back{display:inline-block;margin-top:20px;color:#9a7328}@media(max-width:600px){body{margin:16px auto;padding:0 13px}main{padding:21px 17px;border-radius:13px}h1{font-size:1.65rem}.password-toggle{min-height:36px}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">OAB FÁCIL</p>
    <h1>Entrar na área do aluno</h1>
    <p class="muted">Acesse seu plano de estudos e acompanhe seu progresso.</p>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Senha</label>
      <div class="field-with-action"><input id="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar senha">Mostrar</button></div>
      <button type="submit">Entrar</button>
    </form>
    <p id="message" role="status"></p>
    <details>
      <summary>Esqueci minha senha</summary>
      <p class="muted">Informe seu e-mail. Se houver uma conta, enviaremos um link válido por 30 minutos.</p>
      <form id="forgot-form"><label for="forgot-email">E-mail</label><input id="forgot-email" type="email" required><button type="submit">Solicitar recuperação</button></form>
    </details>
    <details id="reset-box">
      <summary>Já tenho um token de recuperação</summary>
      <form id="reset-form"><label for="reset-token">Token</label><input id="reset-token" autocomplete="off" required><label for="reset-password">Nova senha</label><div class="field-with-action"><input id="reset-password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" id="toggle-reset-password" type="button" aria-label="Mostrar nova senha">Mostrar</button></div><button type="submit">Redefinir senha</button></form>
    </details>
    <a class="back" href="/">← Voltar ao site</a>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button');
      const message = document.querySelector('#message');
      button.disabled = true; message.textContent = 'Verificando acesso…';
      try {
        const response = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email.value.trim(), password:password.value})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Não foi possível entrar.');
        window.location.href = '/aluno';
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const message = document.querySelector('#message');
    document.querySelector('#forgot-form').addEventListener('submit', async event => {event.preventDefault();const response=await fetch('/api/password/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#forgot-email').value.trim()})});const data=await response.json();message.textContent=data.message||'Solicitação processada.';});
    document.querySelector('#reset-form').addEventListener('submit', async event => {event.preventDefault();const response=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#reset-token').value.trim(),new_password:document.querySelector('#reset-password').value})});const data=await response.json();message.textContent=data.message||'Operação processada.';if(response.ok){setTimeout(()=>window.location.href='/aluno',700);}});
    function setupPasswordToggle(buttonId,inputId){const toggle=document.querySelector(buttonId),input=document.querySelector(inputId);toggle?.addEventListener('click',()=>{const visible=input.type==='text';input.type=visible?'password':'text';toggle.textContent=visible?'Mostrar':'Ocultar';toggle.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha');});}
    setupPasswordToggle('#toggle-password','#password');setupPasswordToggle('#toggle-reset-password','#reset-password');
    const queryToken=new URLSearchParams(window.location.search).get('token');if(queryToken){document.querySelector('#reset-token').value=queryToken;document.querySelector('#reset-box').open=true;}
  </script>
</body>
</html>
