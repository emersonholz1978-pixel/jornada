<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diploma jurídico — OAB FÁCIL</title><style>:root{--navy:#17233b;--gold:#c49a48;--line:#e3e8f0;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,Arial}header{background:var(--navy);color:white;padding:18px max(16px,calc((100% - 980px)/2));display:flex;justify-content:space-between}header a{color:#f4d48d;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:24px 16px 60px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#9a7328;font-weight:800}.legal{font-family:Georgia,serif;line-height:1.75;white-space:normal}.muted{color:var(--muted);line-height:1.55}.tag{color:#b42318;font-weight:800}.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:15px}}
</style></head><body><header><strong>OAB FÁCIL</strong><a href="/vade-mecum.html">Voltar ao índice</a></header><main class="wrap"><section class="card"><p class="eyebrow">Consulta em página própria</p><h1 id="title">Diploma jurídico</h1><p id="intro" class="muted">Conteúdo organizado para consulta sem rolagem contínua do índice.</p><input id="search" class="search" placeholder="Buscar artigo nesta página…" aria-label="Buscar artigo"></section><section id="content"></section></main><script>const arts=[{"n": 1, "text": "Art. 1º A República Federativa do Brasil,\nformada pela união indissolúvel dos Estados e Municípios e do Distrito Federal,\nconstitui-se em Estado Democrático de Direito e tem como fundamentos:\n\nI - a soberania;\n\nII - a cidadania;\n\nIII - a dignidade da pessoa humana;\n\nIV - os valores sociais do trabalho e da livre iniciativa;\n(Vide Lei nº 13.874, de \n2019)\n\nV - o pluralismo político.\n\nParágrafo único. Todo o poder emana do povo, que o exerce por meio de\nrepresentantes eleitos ou diretamente, nos termos desta Constituição.\n\n"}, {"n": 2, "text": "Art. 2º São Poderes da União, independentes e harmônicos entre si, o\nLegislativo, o Executivo e o Judiciário.\n\n"}, {"n": 3, "text": "Art. 3º Constituem objetivos fundamentais da República Federativa do\nBrasil:\n\nI - construir uma sociedade livre, justa e solidária;\n\nII - garantir o desenvolvimento nacional;\n\nIII - erradicar a pobreza e a marginalização e reduzir as desigualdades\nsociais e regionais;\n\nIV - promover o bem de todos, sem preconceitos de origem, raça, sexo, cor,\nidade e quaisquer outras formas de discriminação.\n\n"}, {"n": 4, "text": "Art. 4º A República Federativa do Brasil rege-se nas suas relações\ninternacionais pelos seguintes princípios:\n\nI - independência nacional;\n\nII - prevalência dos direitos humanos;\n\nIII - autodeterminação dos povos;\n\nIV - não-intervenção;\n\nV - igualdade entre os Estados;\n\nVI - defesa da paz;\n\nVII - solução pacífica dos conflitos;\n\nVIII - repúdio ao terrorismo e ao racismo;\n\nIX - cooperação entre os povos para o progresso da humanidade;\n\nX - concessão de asilo político.\n\nParágrafo único. A República Federativa do Brasil buscará a integração\neconômica, política, social e cultural dos povos da América Latina, visando à\nformação de uma comunidade latino-americana de nações.\n\nTÍTULO II\n\nDos Direitos e Garantias Fundamentais\n\nCAPÍTULO I\n\nDOS DIREITOS E DEVERES INDIVIDUAIS E COLETIVOS\n\n"}, {"n": 5, "text": "Art. 5º Todos são iguais perante a lei, sem\ndistinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros\nresidentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à\nsegurança e à propriedade, nos termos seguintes:\n\nI - homens e mulheres são iguais em direitos e obrigações, nos termos\ndesta Constituição;\n\nII - ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão\nem virtude de lei;\n\nIII - ninguém será submetido a tortura nem a tratamento desumano ou\ndegradante;\n\nIV - é livre a manifestação do pensamento, sendo vedado o\nanonimato;\n\nV - é assegurado o direito de resposta, proporcional ao agravo, além da\nindenização por dano material, moral ou à imagem;\n\nVI - é inviolável a liberdade de consciência e de crença, sendo\nassegurado o livre exercício dos cultos religiosos e garantida, na forma da lei, a\nproteção aos locais de culto e a suas liturgias;\n\nVII - é assegurada, nos termos da lei, a prestação de assistência\nreligiosa nas entidades civis e militares de internação coletiva;\n\nVIII - ninguém será privado de direitos por motivo de crença religiosa ou\nde convicção filosófica ou política, salvo se as invocar para eximir-se de obrigação\nlegal a todos imposta e recusar-se a cumprir prestação alternativa, fixada em lei;\n\nIX - é livre a expressão da atividade intelectual, artística, científica\ne de comunicação, independentemente de censura ou licença;\n\nX - são invioláveis a intimidade, a vida privada, a honra e a imagem das\npessoas, assegurado o direito a indenização pelo dano material ou moral decorrente de\nsua violação;\n\nXI - a casa é asilo inviolável do indivíduo, ninguém nela podendo\npenetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou\npara prestar socorro, ou, durante o dia, por determinação judicial;              (Vide Lei nº 13.105, \nde 2015) (Vigência)\n\nXII - é inviolável o sigilo da correspondência e das comunicações\ntelegráficas, de dados e das comunicações telefônicas, salvo, no último caso, por\nordem judicial, nas hipóteses e na forma que a lei estabelecer para fins de\ninvestigação criminal ou instrução processual penal;              (Vide Lei nº 9.296, de 1996)\n\nXIII - é livre o exercício de qualquer trabalho, ofício ou profissão,\natendidas as qualificações profissionais que a lei estabelecer;\n\nXIV - é assegurado a todos o acesso à informação e resguardado o sigilo\nda fonte, quando necessário ao exercício profissional;\n\nXV - é livre a locomoção no território nacional em tempo de paz, podendo\nqualquer pessoa, nos termos da lei, nele entrar, permanecer ou dele sair com seus bens;\n\nXVI - todos podem reunir-se pacificamente, sem armas, em locais abertos ao\npúblico, independentemente de autorização, desde que não frustrem outra reunião\nanteriormente convocada para o mesmo local, sendo apenas exigido prévio aviso à\nautoridade competente;\n\nXVII - é plena a liberdade de associação para fins lícitos, vedada a de\ncaráter paramilitar;\n\nXVIII - a criação de associações e, na forma da lei, a de cooperativas\nindependem de autorização, sendo vedada a interferência estatal em seu funcionamento;\n\nXIX - as associações só poderão ser compulsoriamente dissolvidas ou ter\nsuas atividades suspensas por decisão judicial, exigindo-se, no primeiro caso, o\ntrânsito em julgado;\n\nXX - ninguém poderá ser compelido a associar-se ou a permanecer associado;\n\nXXI - as entidades associativas, quando expressamente autorizadas, têm\nlegitimidade para representar seus filiados judicial ou extrajudicialmente;\n\nXXII - é garantido o direito de propriedade;\n\nXXIII - a propriedade atenderá a sua função social;\n\nXXIV - a lei estabelecerá o procedimento para desapropriação por\nnecessidade ou utilidade pública, ou por interesse social, mediante justa e prévia\nindenização em dinheiro, ressalvados os casos previstos nesta Constituição;\n\nXXV - no caso de iminente perigo público, a autoridade competente poderá\nusar de propriedade particular, assegurada ao proprietário indenização ulterior, se\nhouver dano;\n\nXXVI - a pequena propriedade rural, assim definida em lei, desde que\ntrabalhada pela família, não será objeto de penhora para pagamento de débitos\ndecorrentes de sua atividade produtiva, dispondo a lei sobre os meios de financiar o seu\ndesenvolvimento;\n\nXXVII - aos autores pertence o direito exclusivo de utilização,\npublicação ou reprodução de suas obras, transmissível aos herdeiros pelo tempo que a\nlei fixar;\n\nXXVIII - são assegurados, nos termos da lei:\n\na) a proteção às participações individuais em obras coletivas e à\nreprodução da imagem e voz humanas, inclusive nas atividades desportivas;\n\nb) o direito de fiscalização do aproveitamento econômico das obras que\ncriarem ou de que participarem aos criadores, aos intérpretes e às respectivas\nrepresentações sindicais e associativas;\n\nXXIX - a lei assegurará aos autores de inventos industriais privilégio\ntemporário para sua utilização, bem como proteção às criações industriais, à\npropriedade das marcas, aos nomes de empresas e a outros signos distintivos, tendo em\nvista o interesse social e o desenvolvimento tecnológico e econômico do País;\n\nXXX - é garantido o direito de herança;\n\nXXXI - a sucessão de bens de estrangeiros situados no País será regulada\npela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, sempre que não\nlhes seja mais favorável a lei pessoal do \"de cujus\";\n\nXXXII - o Estado promoverá, na forma da lei, a defesa do consumidor;\n\nXXXIII - todos têm direito a receber dos órgãos públicos informações de\nseu interesse particular, ou de interesse coletivo ou geral, que serão prestadas no prazo\nda lei, sob pena de responsabilidade, ressalvadas aquelas cujo sigilo seja imprescindível\nà segurança da sociedade e do Estado;             (Regulamento) (Vide Lei nº 12.527, de 2011)\n\nXXXIV - são a todos assegurados, independentemente do pagamento de taxas:\n\na) o direito de petição aos Poderes Públicos em defesa de direitos\nou contra ilegalidade ou abuso de poder;\n\nb) a obtenção de certidões em repartições públicas, para defesa de\ndireitos e esclarecimento de situações de interesse pessoal;\n\nXXXV - a lei não excluirá da apreciação do Poder Judiciário lesão ou\nameaça a direito;\n\nXXXVI - a lei não prejudicará o direito adquirido, o ato jurídico perfeito\ne a coisa julgada;\n\nXXXVII - não haverá juízo ou tribunal de exceção;\n\nXXXVIII - é reconhecida a instituição do júri, com a organização que\nlhe der a lei, assegurados:\n\na) a plenitude de defesa;\n\nb) o sigilo das votações;\n\nc) a soberania dos veredictos;\n\nd) a competência para o julgamento dos crimes dolosos contra a vida;\n\nXXXIX - não há crime sem lei anterior que o defina, nem pena sem prévia\ncominação legal;\n\nXL - a lei penal não retroagirá, salvo para beneficiar o réu;\n\nXLI - a lei punirá qualquer discriminação atentatória dos direitos e\nliberdades fundamentais;\n\nXLII - a prática do racismo constitui crime inafiançável e\nimprescritível, sujeito à pena de reclusão, nos termos da lei;\n\nXLIII - a lei considerará crimes inafiançáveis e insuscetíveis de graça\nou anistia a prática da tortura , o tráfico ilícito de entorpecentes e drogas afins, o\nterrorismo e os definidos como crimes hediondos, por eles respondendo os mandantes, os\nexecutores e os que, podendo evitá-los, se omitirem;\n(Regulamento)\n\nXLIV - constitui crime inafiançável e imprescritível a ação de grupos\narmados, civis ou militares, contra a ordem constitucional e o Estado Democrático;\n\nXLV - nenhuma pena passará da pessoa do condenado, podendo a obrigação de\nreparar o dano e a decretação do perdimento de bens ser, nos termos da lei, estendidas\naos sucessores e contra eles executadas, até o limite do valor do patrimônio\ntransferido;\n\nXLVI - a lei regulará a individualização da pena e adotará, entre outras,\nas seguintes:\n\na) privação ou restrição da liberdade;\n\nb) perda de bens;\n\nc) multa;\n\nd) prestação social alternativa;\n\ne) suspensão ou interdição de direitos;\n\nXLVII - não haverá penas:\n\na) de morte, salvo em caso de guerra declarada, nos termos do art. 84, XIX;\n\nb) de caráter perpétuo;\n\nc) de trabalhos forçados;\n\nd) de banimento;\n\ne) cruéis;\n\nXLVIII - a pena será cumprida em estabelecimentos distintos, de acordo com a\nnatureza do delito, a idade e o sexo do apenado;\n\nXLIX - é assegurado aos presos o respeito à integridade física e moral;\n\nL - às presidiárias serão asseguradas condições para que possam\npermanecer com seus filhos durante o período de amamentação;\n\nLI - nenhum brasileiro será extraditado, salvo o naturalizado, em caso de\ncrime comum, praticado antes da naturalização, ou de comprovado envolvimento em tráfico\nilícito de entorpecentes e drogas afins, na forma da lei;\n\nLII - não será concedida extradição de estrangeiro por crime político ou\nde opinião;\n\nLIII - ninguém será processado nem sentenciado senão pela autoridade\ncompetente;\n\nLIV - ninguém será privado da liberdade ou de seus bens sem o devido\nprocesso legal;\n\nLV - aos litigantes, em processo judicial ou administrativo, e aos acusados\nem geral são assegurados o contraditório e ampla defesa, com os meios e recursos a ela\ninerentes;\n\nLVI - são inadmissíveis, no processo, as provas obtidas por meios\nilícitos;\n\nLVII - ninguém será considerado culpado até o trânsito em julgado de\nsentença penal condenatória;\n\nLVIII - o civilmente identificado não será submetido a identificação\ncriminal, salvo nas hipóteses previstas em lei;\n(Regulamento)\n\nLIX - será admitida ação privada nos crimes de ação pública, se esta\nnão for intentada no prazo legal;\n\nLX - a lei só poderá restringir a publicidade dos atos processuais quando a\ndefesa da intimidade ou o interesse social o exigirem;\n\nLXI - ninguém será preso senão em flagrante delito ou por ordem escrita e\nfundamentada de autoridade judiciária competente, salvo nos casos de transgressão\nmilitar ou crime propriamente militar, definidos em lei;\n\nLXII - a prisão de qualquer pessoa e o local onde se encontre serão\ncomunicados imediatamente ao juiz competente e à família do preso ou à pessoa\npor ele indicada;\n\nLXIII - o preso será informado de seus direitos, entre os quais o de\npermanecer calado, sendo-lhe assegurada a assistência da família e de advogado;\n\nLXIV - o preso tem direito à identificação dos responsáveis por sua\nprisão ou por seu interrogatório policial;\n\nLXV - a prisão ilegal será imediatamente relaxada pela autoridade\njudiciária;\n\nLXVI - ninguém será levado à prisão ou nela mantido, quando a lei admitir\na liberdade provisória, com ou sem fiança;\n\nLXVII - não haverá prisão civil por dívida, salvo a do responsável pelo\ninadimplemento voluntário e inescusável de obrigação alimentícia e a do depositário\ninfiel;\n\nLXVIII - conceder-se-á _habeas corpus_ sempre que alguém sofrer\nou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção,\npor ilegalidade ou abuso de poder;\n\nLXIX - conceder-se-á mandado de segurança para proteger direito líquido e\ncerto, não amparado por _habeas corpus_ ou _habeas data_, quando o\nresponsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de\npessoa jurídica no exercício de atribuições do Poder Público;\n\nLXX - o mandado de segurança coletivo pode ser impetrado por:\n\na) partido político com representação no Congresso Nacional;\n\nb) organização sindical, entidade de classe ou associação legalmente\nconstituída e em funcionamento há pelo menos um ano, em defesa dos interesses de seus\nmembros ou associados;\n\nLXXI - conceder-se-á mandado de injunção sempre que a falta de norma\nregulamentadora torne inviável o exercício dos direitos e liberdades constitucionais e\ndas prerrogativas inerentes à nacionalidade, à soberania e à cidadania;\n\nLXXII - conceder-se-á _habeas data:_\n\na) para assegurar o conhecimento de informações relativas à pessoa do\nimpetrante, constantes de registros ou bancos de dados de entidades governamentais ou de\ncaráter público;\n\nb) para a retificação de dados, quando não se prefira fazê-lo por\nprocesso sigiloso, judicial ou administrativo;\n\nLXXIII - qualquer cidadão é parte legítima para propor ação popular que\nvise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe,\nà moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural,\nficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da\nsucumbência;\n\nLXXIV - o Estado prestará assistência jurídica integral e gratuita aos que\ncomprovarem insuficiência de recursos;\n\nLXXV - o Estado indenizará o condenado por erro judiciário, assim como o\nque ficar preso além do tempo fixado na sentença;\n\nLXXVI - são gratuitos para os reconhecidamente pobres, na forma da lei:               (Vide \nLei \nnº 7.844, de 1989)\n\na) o registro civil de nascimento;\n\nb) a certidão de óbito;\n\nLXXVII - são gratuitas as ações de _habeas corpus_ e _habeas data_, e, na forma da lei, os atos necessários ao exercício da\ncidadania.            (Regulamento)\n\nLXXVIII\n- a todos, no âmbito\njudicial e administrativo, são assegurados a razoável duração do processo e os meios\nque garantam a celeridade de sua tramitação.            (Incluído pela Emenda Constitucional nº 45, de 2004) (Vide ADIN 3392)\n\nLXXIX - é assegurado, nos termos da lei, o direito à proteção dos dados\n\npessoais, inclusive nos meios digitais.   (Incluído pela Emenda Constitucional nº \n115, de 2022)\n\n§ 1º As normas definidoras dos direitos e\ngarantias fundamentais têm aplicação imediata.\n\n§ 2º Os direitos e garantias expressos nesta Constituição não excluem\noutros decorrentes do regime e dos princípios por ela adotados, ou dos tratados\ninternacionais em que a República Federativa do Brasil seja parte.\n\n§ 3º Os tratados e convenções\ninternacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso\nNacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão\nequivalentes às emendas constitucionais.            (Incluído pela Emenda Constitucional nº 45, de 2004) (Vide ADIN 3392)\n( Vide Atos decorrentes do disposto no § 3º do \nart. 5º da Constituição)\n\n§ 4º O Brasil se submete à\njurisdição de Tribunal Penal Internacional a cuja criação tenha manifestado adesão.               (Incluído pela Emenda Constitucional nº 45, de 2004)\n\nCAPÍTULO II\n\nDOS DIREITOS SOCIAIS\n\n"}, {"n": 6, "text": "Art. 6º São direitos sociais a educação, a\nsaúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança,\na previdência social, a proteção à maternidade e à infância, a assistência aos\ndesamparados, na forma desta Constituição.\n(Redação dada pela Emenda Constitucional nº 90, \nde 2015)\n\nParágrafo único. Todo brasileiro em situação de\nvulnerabilidade social terá direito a uma renda básica familiar, garantida\npelo poder público em programa permanente de transferência de renda, cujas\nnormas e requisitos de acesso serão determinados em lei, observada a\nlegislação fiscal e orçamentária.\n(Incluído pela Emenda Constitucional \nnº 114, de 2021)(Vide Lei nº 14.601, de 2023)\n\n"}, {"n": 7, "text": "Art. 7º São direitos dos trabalhadores urbanos e rurais, além de outros\nque visem à melhoria de sua condição social:\n\nI - relação de emprego protegida contra despedida arbitrária ou sem justa\ncausa, nos termos de lei complementar, que preverá indenização compensatória, dentre\noutros direitos;\n\nII - seguro-desemprego, em caso de desemprego involuntário;\n\nIII - fundo de garantia do tempo de serviço;\n\nIV - salário mínimo , fixado em lei, nacionalmente\nunificado, capaz de atender a suas necessidades vitais básicas e às de sua família com\nmoradia, alimentação, educação, saúde, lazer, vestuário, higiene, transporte e\nprevidência social, com reajustes periódicos que lhe preservem o poder aquisitivo, sendo\nvedada sua vinculação para qualquer fim;\n\nV - piso salarial proporcional à extensão e à complexidade do trabalho;\n\nVI - irredutibilidade do salário, salvo o disposto em convenção ou acordo\ncoletivo;\n\nVII - garantia de salário, nunca inferior ao mínimo, para os que percebem\nremuneração variável;\n\nVIII - décimo terceiro salário com base na remuneração integral ou no\nvalor da aposentadoria;\n\nIX – remuneração do trabalho noturno superior à do diurno;\n\nX - proteção do salário na forma da lei, constituindo crime sua retenção\ndolosa;\n\nXI – participação nos lucros, ou resultados, desvinculada da\nremuneração, e, excepcionalmente, participação na gestão da empresa, conforme\ndefinido em lei;\n\nXII -\nsalário-família pago em razão do dependente do trabalhador de baixa renda nos termos da\nlei;(Redação dada pela\nEmenda Constitucional nº 20, de 1998)\n\nXIII - duração do trabalho normal não superior a\noito horas diárias e quarenta e quatro semanais, facultada a compensação de horários e\na redução da jornada, mediante acordo ou convenção coletiva de trabalho;        (Vide Decreto-Lei nº 5.452, de 1943)\n\nXIV - jornada de seis horas para o trabalho realizado em turnos ininterruptos\nde revezamento, salvo negociação coletiva;\n\nXV - repouso semanal remunerado, preferencialmente aos domingos;\n\nXVI - remuneração do serviço extraordinário superior, no mínimo, em\ncinqüenta por cento à do normal;\n(Vide Del\n5.452, art. 59 § 1º)\n\nXVII - gozo de férias anuais remuneradas com, pelo menos, um terço a mais\ndo que o salário normal;\n\nXVIII - licença à gestante, sem prejuízo do emprego e do salário, com a\nduração de cento e vinte dias;\n\nXIX - licença-paternidade, nos termos fixados em lei;\n\nXX - proteção do mercado de trabalho da mulher, mediante incentivos\nespecíficos, nos termos da lei;\n\nXXI - aviso prévio proporcional ao tempo de serviço, sendo no mínimo de\ntrinta dias, nos termos da lei;\n\nXXII - redução dos riscos inerentes ao trabalho, por meio de normas de\nsaúde, higiene e segurança;\n\nXXIII - adicional de remuneração para as atividades penosas, insalubres ou\nperigosas, na forma da lei;\n\nXXIV - aposentadoria;\n\nXXV\n- assistência gratuita aos filhos e dependentes desde o nascimento até 5 (cinco)\nanos de idade em creches e pré-escolas; (Redação dada pela Emenda Constitucional nº 53, de 2006)\n\nXXVI - reconhecimento das convenções e acordos coletivos de trabalho;\n\nXXVII - proteção em face da automação, na forma da lei;\n\nXXVIII - seguro contra acidentes de trabalho, a cargo do empregador, sem\nexcluir a indenização a que este está obrigado, quando incorrer em dolo ou culpa;\n\nXXIX - ação,\nquanto aos créditos resultantes das relações de trabalho, com prazo prescricional de\ncinco anos para os trabalhadores urbanos e rurais, até o limite de dois anos após a\nextinção do contrato de trabalho;(Redação dada pela\nEmenda Constitucional nº 28, de 2000)\n\na) (Revogada).               (Redação \ndada pela\nEmenda Constitucional nº 28, de 2000)\n\nb)\n(Revogada).              (Redação \ndada pela\nEmenda Constitucional nº 28, de 2000)\n\nXXX - proibição de diferença de salários, de exercício de funções e de\ncritério de admissão por motivo de sexo, idade, cor ou estado civil;\n\nXXXI - proibição de qualquer discriminação no tocante a salário e\ncritérios de admissão do trabalhador portador de deficiência;\n\nXXXII - proibição de distinção entre trabalho manual, técnico e\nintelectual ou entre os profissionais respectivos;\n\nXXXIII - proibição de trabalho noturno,\nperigoso ou insalubre a menores de dezoito e de qualquer trabalho a menores de dezesseis\nanos, salvo na condição de aprendiz, a partir de quatorze anos;             (Redação dada pela Emenda Constitucional nº 20,\nde 1998)\n\nXXXIV - igualdade de direitos entre o trabalhador com vínculo empregatício\npermanente e o trabalhador avulso.\n\nParágrafo único. São\nassegurados à categoria dos trabalhadores domésticos os direitos previstos nos\nincisos IV, VI, VII, VIII, X, XIII, XV, XVI, XVII, XVIII, XIX, XXI, XXII, XXIV,\nXXVI, XXX, XXXI e XXXIII e, atendidas as condições estabelecidas em lei e\nobservada a simplificação do cumprimento das obrigações tributárias, principais\ne acessórias, decorrentes da relação de trabalho e suas peculiaridades, os\nprevistos nos incisos I, II, III, IX, XII, XXV e XXVIII, bem como a sua\nintegração à previdência social.              (Redação dada pela Emenda Constitucional nº \n72, de\n2013)\n\n"}, {"n": 8, "text": "Art. 8º É livre a associação profissional ou sindical, observado o\nseguinte:\n\nI - a lei não poderá exigir autorização do Estado para a fundação de\nsindicato, ressalvado o registro no órgão competente, vedadas ao Poder Público a\ninterferência e a intervenção na organização sindical;\n\nII - é vedada a criação de mais de uma organização sindical, em qualquer\ngrau, representativa de categoria profissional ou econômica, na mesma base territorial,\nque será definida pelos trabalhadores ou empregadores interessados, não podendo ser\ninferior à área de um Município;\n\nIII - ao sindicato cabe a defesa dos direitos e interesses coletivos ou\nindividuais da categoria, inclusive em questões judiciais ou administrativas;\n\nIV - a assembléia geral fixará a contribuição que,\nem se tratando de categoria profissional, será descontada em folha, para custeio do\nsistema confederativo da representação sindical respectiva, independentemente da\ncontribuição prevista em lei;\n\nV - ninguém será obrigado a filiar-se ou a manter-se filiado a sindicato;\n\nVI - é obrigatória a participação dos sindicatos nas negociações\ncoletivas de trabalho;\n\nVII - o aposentado filiado tem direito a votar e ser votado nas\norganizações sindicais;\n\nVIII - é vedada a dispensa do empregado sindicalizado a partir do registro\nda candidatura a cargo de direção ou representação sindical e, se eleito, ainda que\nsuplente, até um ano após o final do mandato, salvo se cometer falta grave nos termos da\nlei.\n\nParágrafo único. As disposições deste artigo aplicam-se à organização\nde sindicatos rurais e de colônias de pescadores, atendidas as condições que a lei\nestabelecer.\n\n"}, {"n": 9, "text": "Art. 9º É assegurado o direito de greve, competindo aos trabalhadores\ndecidir sobre a oportunidade de exercê-lo e sobre os interesses que devam por meio dele\ndefender.\n\n§ 1º A lei definirá os serviços ou atividades essenciais e disporá\nsobre o atendimento das necessidades inadiáveis da comunidade.\n\n§ 2º Os abusos cometidos sujeitam os responsáveis às penas da lei.\n\n"}, {"n": 10, "text": "Art. 10. É assegurada a participação dos trabalhadores e empregadores nos\ncolegiados dos órgãos públicos em que seus interesses profissionais ou previdenciários\nsejam objeto de discussão e deliberação.\n\n"}, {"n": 11, "text": "Art. 11. Nas empresas de mais de duzentos empregados, é assegurada a\neleição de um representante destes com a finalidade exclusiva de promover-lhes o\nentendimento direto com os empregadores.\n\nCAPÍTULO III\n\nDA NACIONALIDADE\n\n"}, {"n": 12, "text": "Art. 12. São brasileiros:\n\nI - natos:\n\na) os nascidos na República Federativa do Brasil, ainda que de pais\nestrangeiros, desde que estes não estejam a serviço de seu país;\n\nb) os nascidos no estrangeiro, de pai brasileiro ou mãe brasileira, desde\nque qualquer deles esteja a serviço da República Federativa do Brasil;\n\nc) os nascidos no estrangeiro de pai brasileiro ou de mãe brasileira, desde que sejam registrados em repartição brasileira\ncompetente ou venham a residir na República Federativa do Brasil\ne optem, em qualquer tempo, depois de atingida a maioridade, pela nacionalidade brasileira;\n(Redação dada pela Emenda Constitucional nº \n54, de 2007)\n\nII - naturalizados:\n\na) os que, na forma da lei, adquiram a nacionalidade brasileira, exigidas aos\noriginários de países de língua portuguesa apenas residência por um ano ininterrupto e\nidoneidade moral;\n\nb) os estrangeiros de qualquer nacionalidade,\nresidentes na República Federativa do Brasil há mais de quinze anos ininterruptos e sem\ncondenação penal, desde que requeiram a nacionalidade brasileira. (Redação dada pela Emenda Constitucional de Revisão nº 3, de\n1994)\n\n§ 1º   Aos portugueses com\nresidência permanente no País, se houver reciprocidade em favor de brasileiros, serão\natribuídos os direitos inerentes ao brasileiro, salvo os casos previstos nesta\nConstituição.               (Redação dada pela\nEmenda Constitucional de Revisão nº 3, de 1994)\n\n§ 2º A lei não poderá estabelecer distinção entre brasileiros natos e\nnaturalizados, salvo nos casos previstos nesta Constituição.\n\n§ 3º São privativos de brasileiro nato os cargos:\n\nI - de Presidente e Vice-Presidente da República;\n\nII - de Presidente da Câmara dos Deputados;\n\nIII - de Presidente do Senado Federal;\n\nIV - de Ministro do Supremo Tribunal Federal;\n\nV - da carreira diplomática;\n\nVI - de oficial das Forças Armadas.\n\nVII - de Ministro de Estado da Defesa.                 (Incluído pela\nEmenda Constitucional nº 23, de 1999)\n\n§ 4º - Será declarada a perda da nacionalidade do brasileiro que:\n\nI - tiver cancelada sua naturalização, por\nsentença judicial, em virtude de fraude relacionada ao processo de naturalização\nou de atentado contra a ordem constitucional e o Estado Democrático;\n(Redação dada pela Emenda Constitucional \nnº 131, de 2023)\n\nII - fizer pedido expresso de perda da\nnacionalidade brasileira perante autoridade brasileira competente, ressalvadas\nsituações que acarretem apatridia.     (Redação dada pela Emenda Constitucional \nnº 131, de 2023)\n\na) revogada;\n(Redação dada pela Emenda Constitucional \nnº 131, de 2023)\n\nb) revogada.      (Redação dada pela Emenda Constitucional \nnº 131, de 2023)\n\n§ 5º A renúncia da nacionalidade, nos termos do\ninciso II do § 4º deste artigo, não impede o interessado de readquirir sua\nnacionalidade brasileira originária, nos termos da lei.\n(Incluído pela Emenda Constitucional nº \n131, de 2023)\n\n"}, {"n": 13, "text": "Art. 13. A língua portuguesa é o idioma oficial da República Federativa do\nBrasil.\n\n§ 1º São símbolos da República Federativa do Brasil a bandeira, o\nhino, as armas e o selo nacionais.\n\n§ 2º Os Estados, o Distrito Federal e os Municípios poderão ter\nsímbolos próprios.\n\nCAPÍTULO IV\n\nDOS DIREITOS POLÍTICOS\n\n"}, {"n": 14, "text": "Art. 14. A soberania popular será exercida pelo sufrágio universal\ne pelo voto direto e secreto, com valor igual para todos, e, nos termos da lei, mediante:\n\nI - plebiscito;\n\nII - referendo;\n\nIII - iniciativa popular.\n\n§ 1º O alistamento eleitoral e o voto são:\n\nI - obrigatórios para os maiores de dezoito anos;\n\nII - facultativos para:\n\na) os analfabetos;\n\nb) os maiores de setenta anos;\n\nc) os maiores de dezesseis e menores de dezoito anos.\n\n§ 2º Não podem alistar-se como eleitores os estrangeiros e, durante o\nperíodo do serviço militar obrigatório, os conscritos.\n\n§ 3º São condições de elegibilidade, na forma da lei:\n\nI - a nacionalidade brasileira;\n\nII - o pleno exercício dos direitos políticos;\n\nIII - o alistamento eleitoral;\n\nIV - o domicílio eleitoral na circunscrição;\n\nV - a filiação partidária;           Regulamento\n\nVI - a idade mínima de:\n\na) trinta e cinco anos para Presidente e Vice-Presidente da\nRepública e Senador;\n\nb) trinta anos para Governador e Vice-Governador de Estado e do Distrito\nFederal;\n\nc) vinte e um anos para Deputado Federal, Deputado Estadual ou Distrital,\nPrefeito, Vice-Prefeito e juiz de paz;\n\nd) dezoito anos para Vereador.\n\n§ 4º São inelegíveis os inalistáveis e os analfabetos.\n\n§ 5º O Presidente da República, os Governadores de Estado e do\nDistrito Federal, os Prefeitos e quem os houver sucedido, ou substituído no curso dos\nmandatos poderão ser reeleitos para um único período subseqüente.(Redação dada pela Emenda Constitucional nº 16, de 1997)\n\n§ 6º Para concorrerem a outros cargos, o Presidente da República, os\nGovernadores de Estado e do Distrito Federal e os Prefeitos devem renunciar aos\nrespectivos mandatos até seis meses antes do pleito.\n\n§ 7º São inelegíveis, no território de jurisdição do titular, o\ncônjuge e os parentes consangüíneos ou afins, até o segundo grau ou por adoção, do\nPresidente da República, de Governador de Estado ou Território, do Distrito Federal, de\nPrefeito ou de quem os haja substituído dentro dos seis meses anteriores ao pleito, salvo\nse já titular de mandato eletivo e candidato à reeleição.\n\n§ 8º O militar alistável é elegível, atendidas as seguintes\ncondições:\n\nI - se contar menos de dez anos de serviço, deverá afastar-se da atividade;\n\nII - se contar mais de dez anos de serviço, será agregado pela autoridade\nsuperior e, se eleito, passará automaticamente, no ato da diplomação, para a\ninatividade.\n\n§ 9º\nLei complementar estabelecerá outros casos de inelegibilidade e os prazos de sua\ncessação, a fim de proteger a probidade administrativa, a moralidade para exercício de\nmandato considerada vida pregressa do candidato, e a normalidade e legitimidade das\neleições contra a influência do poder econômico ou o abuso do exercício de função,\ncargo ou emprego na administração direta ou indireta.              (Redação dada pela Emenda Constitucional de Revisão\nnº 4, de 1994)\n\n§ 10. O mandato eletivo poderá ser impugnado ante a Justiça Eleitoral no\nprazo de quinze dias contados da diplomação, instruída a ação com provas de abuso do\npoder econômico, corrupção ou fraude.\n\n§ 11. A ação de impugnação de mandato tramitará em segredo de\njustiça, respondendo o autor, na forma da lei, se temerária ou de manifesta má-fé.\n\n§ 12.\nSerão realizadas concomitantemente às eleições municipais as consultas populares\nsobre questões locais aprovadas pelas Câmaras Municipais e encaminhadas à\nJustiça Eleitoral até 90 (noventa) dias antes da data das eleições, observados\nos limites operacionais relativos ao número de quesitos.\n(Incluído pela Emenda Constitucional nº \n111, de 2021)\n\n§ 13.\nAs manifestações favoráveis e contrárias às questões submetidas às consultas\npopulares nos termos do § 12 ocorrerão durante as campanhas eleitorais, sem a\nutilização de propaganda gratuita no rádio e na televisão.\n(Incluído pela Emenda Constitucional nº \n111, de 2021)\n\n"}, {"n": 15, "text": "Art. 15. É vedada a cassação de direitos políticos, cuja perda ou\nsuspensão só se dará nos casos de:\n\nI - cancelamento da naturalização por sentença transitada em julgado;\n\nII - incapacidade civil absoluta;\n\nIII - condenação criminal transitada em julgado, enquanto durarem seus\nefeitos;\n\nIV - recusa de cumprir obrigação a todos imposta ou prestação\nalternativa, nos termos do art. 5º, VIII;\n\nV - improbidade administrativa, nos termos do art. 37, § 4º.\n\n"}, {"n": 16, "text": "Art. 16. A lei que alterar o processo eleitoral entrará em vigor na\ndata de sua publicação, não se aplicando à eleição que ocorra até um ano da data de\nsua vigência.              (Redação dada pela Emenda Constitucional\nnº 4, de 1993)\n\nCAPÍTULO V\n\nDOS PARTIDOS POLÍTICOS\n\n"}, {"n": 17, "text": "Art. 17. É livre a criação, fusão, incorporação e extinção de\npartidos políticos, resguardados a soberania nacional, o regime democrático, o\npluripartidarismo, os direitos fundamentais da pessoa humana e observados os seguintes\npreceitos:               Regulamento\n\nI - caráter nacional;\n\nII - proibição de recebimento de recursos financeiros de entidade ou\ngoverno estrangeiros ou de subordinação a estes;\n\nIII - prestação de contas à Justiça Eleitoral;\n\nIV - funcionamento parlamentar de acordo com a lei.\n\n§ 1º É assegurada\naos partidos políticos autonomia para definir sua estrutura interna e\nestabelecer regras sobre escolha, formação e duração de seus órgãos permanentes\ne provisórios e sobre sua organização e funcionamento e para adotar os critérios\nde escolha e o regime de suas coligações nas eleições majoritárias, vedada a sua\ncelebração nas eleições proporcionais, sem obrigatoriedade de vinculação entre\nas candidaturas em âmbito nacional, estadual, distrital ou municipal, devendo\nseus estatutos estabelecer normas de disciplina e fidelidade partidária.\n(Redação dada pela Emenda Constitucional nº \n97, de 2017)\n\n§ 2º Os partidos políticos, após adquirirem personalidade jurídica, na\nforma da lei civil, registrarão seus estatutos no Tribunal Superior Eleitoral.\n\n§ 3º Somente\nterão direito a recursos do fundo partidário e acesso gratuito ao rádio e à\ntelevisão, na forma da lei, os partidos políticos que alternativamente:\n(Redação dada pela Emenda Constitucional nº \n97, de 2017)\n\nI - obtiverem,\nnas eleições para a Câmara dos Deputados, no mínimo, 3% (três por cento) dos\nvotos válidos, distribuídos em pelo menos um terço das unidades da Federação,\ncom um mínimo de 2% (dois por cento) dos votos válidos em cada uma delas; ou\n(Incluído pela Emenda Constitucional nº 97, \nde 2017)\n\nII - tiverem\nelegido pelo menos quinze Deputados Federais distribuídos em pelo menos um terço\ndas unidades da Federação.\n(Incluído pela Emenda Constitucional nº 97, \nde 2017)\n\n§ 4º É vedada a utilização pelos partidos políticos de organização\nparamilitar.\n\n§ 5º Ao eleito\npor partido que não preencher os requisitos previstos no § 3º deste artigo é\nassegurado o mandato e facultada a filiação, sem perda do mandato, a outro\npartido que os tenha atingido, não sendo essa filiação considerada para fins de\ndistribuição dos recursos do fundo partidário e de acesso gratuito ao tempo de\nrádio e de televisão.\n(Incluído pela Emenda Constitucional nº 97, \nde 2017)\n\n§ 6º Os Deputados Federais, os Deputados Estaduais,\nos Deputados Distritais e os Vereadores que se desligarem do partido pelo qual\ntenham sido eleitos perderão o mandato, salvo nos casos de anuência do partido\nou de outras hipóteses de justa causa estabelecidas em lei, não computada, em\nqualquer caso, a migração de partido para fins de distribuição de recursos do\nfundo partidário ou de outros fundos públicos e de acesso gratuito ao rádio e à\ntelevisão.   (Incluído pela Emenda Constitucional nº \n111, de 2021)\n\n§ 7º Os partidos políticos devem aplicar no mínimo 5% (cinco por cento) dos\nrecursos do fundo partidário na criação e na manutenção de programas de promoção\ne difusão da participação política das mulheres, de acordo com os interesses\nintrapartidários.\n(Incluído pela Emenda Constitucional \nnº 117, de 2022)\n\n§ 8º O montante do Fundo Especial de Financiamento de Campanha e da parcela do\nfundo partidário destinada a campanhas eleitorais, bem como o tempo de\npropaganda gratuita no rádio e na televisão a ser distribuído pelos partidos às\nrespectivas candidatas, deverão ser de no mínimo 30% (trinta por cento),\nproporcional ao número de candidatas, e a distribuição deverá ser realizada\nconforme critérios definidos pelos respectivos órgãos de direção e pelas normas\nestatutárias, considerados a autonomia e o interesse partidário.\n(Incluído pela Emenda Constitucional \nnº 117, de 2022)\n\n§ 9º Dos recursos oriundos do Fundo Especial de\nFinanciamento de Campanha e do fundo partidário destinados às campanhas\neleitorais, os partidos políticos devem, obrigatoriamente, aplicar 30% (trinta\npor cento) em candidaturas de pessoas pretas e pardas, nas circunscrições que\nmelhor atendam aos interesses e às estratégias partidárias.\n(Incluído pela Emenda Constitucional nº \n133, de 2024)\n\n**TÍTULO III**\n\n**Da Organização do Estado**\n\nCAPÍTULO I\n\nDA ORGANIZAÇÃO POLÍTICO-ADMINISTRATIVA\n\n"}];const params=new URLSearchParams(location.search);const norma=params.get('norma')||'Diploma jurídico';document.title=norma+' — OAB FÁCIL';document.querySelector('#title').textContent=norma;const content=document.querySelector('#content'),search=document.querySelector('#search');function render(){const q=search.value.toLowerCase();let list=arts.filter(a=>a.text.toLowerCase().includes(q));if(!norma.toLowerCase().includes('constitui'))list=[];content.innerHTML=list.length?list.map(a=>`<article class="card"><p class="eyebrow">Constituição Federal • art. ${a.n}º</p><h2>Art. ${a.n}º</h2><p class="tag">🔴 Prioridade 1 — estudar primeiro</p><p class="legal">${a.text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('
','<br>')}</p><p class="muted">Fonte: Planalto. Conferido em 09/09/2026. A classificação visual não altera o texto legal.</p></article>`).join(''):`<article class="card"><h2>Conteúdo em preparação</h2><p class="muted">Este diploma já possui página própria. O texto integral será inserido e auditado nesta página, sem exigir navegação externa.</p></article>`}search.oninput=render;render();</script></body></html>
